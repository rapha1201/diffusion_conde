# Conditional latent diffusion (partial noising): p(z_y | z_x) on 16x16 latents. Single GPU: slurm/ldm.slurm
# z_x = seismic latent (8 ch, clean condition), z_y = RGT latent (4 ch, noised). UNet input 12 ch, output 4 ch.
experiment: ldm
kind: ldm
out_dir: runs/ldm
seed: 0
val_key: sample/mae     # single-sample MAE (EMA weights); mean4/*, ae/* and spread are logged too

vae:                    # frozen; written by compute_latent_scale.py (slurm/latent_scale.slurm)
  seismic: runs/ae_seismic/vae_scaled.pt
  rgt: runs/ae_rgt/vae_scaled.pt

data:
  h5_path: /pgeoprj/godeep/ej49/ConDe/dataset/fault_aware.h5
  split: null           # same default split as the autoencoders (val M7 / test M2)
  include_reflectivity: false
  clip_percentiles: [0.5, 99.5]
  min_valid_frac_section: 0.25
  buffer_size: 4096
  num_workers: 8
  batch_size: 64
  val_max_per_source: 128   # x 2 Modelo7 sources = 256 sections, each sampled val.n_samples times
  val_batch_size: 64

transform:
  output_size: 128
  min_valid_frac: 0.5   # crops below this are dropped (the RGT AE never learned them)

augment:                # same augmentation as the autoencoders
  aug_p: 0.8
  p_statics: 0.1
  statics_shift_range: [1.0, 5.0]
  p_fault: 0.3
  p_rotation: 0.2
  rotation_deg_range: [-10.0, 10.0]
  p_shear: 0.1
  shear_deg_range: [-8.0, 8.0]
  p_aniso: 0.2
  p_zoom: 0.2
  zoom_range: [0.9, 1.25]
  p_hflip: 0.5

model:                  # denoiser UNet on 16x16: levels 16 -> 8 -> 4, self-attention at every level
  block_out_channels: [128, 256, 512]
  layers_per_block: 2
  attention_levels: [0, 1, 2]
  attention_head_dim: 64
  norm_num_groups: 32

diffusion:
  num_train_timesteps: 1000
  beta_schedule: scaled_linear   # Stable Diffusion betas
  beta_start: 0.00085
  beta_end: 0.012
  prediction_type: epsilon       # or v_prediction
  cond_drop_prob: 0.0            # > 0 (e.g. 0.1) enables classifier-free guidance (sampling.guidance_scale)

sampling:
  steps: 50             # DDIM
  eta: 0.0
  guidance_scale: 1.0

val:
  n_samples: 4          # mean/std of 4 samples per section at every validation

optim:
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  warmup_steps: 2000
  total_steps: 300000
  min_lr_ratio: 0.1
  grad_clip: 1.0
  precision: auto
  ema_decay: 0.9999

log_every: 100
val_every: 2500
ckpt_every: 5000
n_vis: 8
