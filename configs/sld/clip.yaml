# Phase A: CLIP-style pretraining of the seismic condition encoder on the frozen VAE latents.
# Single GPU: slurm/clip.slurm. Phase B (configs/sld/ldm_clip.yaml) loads runs/clip/ckpt_best.pt.
experiment: clip
kind: clip
out_dir: runs/clip
seed: 0
val_key: val_models/err   # 1 - retrieval accuracy on the held-out volume

vae:                      # frozen; the same ones the LDM uses
  seismic: runs/ae_seismic/vae_scaled.pt
  rgt: runs/ae_rgt/vae_scaled.pt

data:
  h5_path: /pgeoprj/godeep/ej49/ConDe/dataset/fault_aware.h5
  split: null
  include_reflectivity: false
  clip_percentiles: [0.5, 99.5]
  min_valid_frac_section: 0.25
  buffer_size: 4096
  num_workers: 8
  batch_size: 128           # = candidates per contrastive classification; more negatives help CLIP
  val_max_per_source: 128   # Modelo7: 2 realizations x 128 sections
  train_eval_max_per_source: 32
  val_batch_size: 64

transform:
  output_size: 128
  min_valid_frac: 0.5

# Stronger structural augmentation than the Phase-1/2 runs (same block in ldm_clip.yaml). Geometry is
# shared by seismic and RGT (and the warp stays inside the section), so every crop is still a correct pair.
augment:
  aug_p: 0.9
  p_statics: 0.25
  statics_shift_range: [1.0, 8.0]
  p_fault: 0.6
  fault_throw_range: [4.0, 28.0]
  fault_slope_range: [-0.6, 0.6]
  p_rotation: 0.4
  rotation_deg_range: [-25.0, 25.0]
  p_shear: 0.3
  shear_deg_range: [-12.0, 12.0]
  p_aniso: 0.35
  aniso_x_range: [0.8, 1.25]
  aniso_z_range: [0.8, 1.25]
  p_zoom: 0.35
  zoom_range: [0.8, 1.35]
  p_hflip: 0.5

model:
  embed_dim: 128          # features handed to the LDM (UNet input = 8 + 128 + 4 channels)
  encoder_blocks: 4
  norm_num_groups: 32
  proj_dim: 128           # CLIP embedding size (heads are discarded after Phase A)
  mode: dense             # dense: per latent position | global: pooled, classic CLIP
  temperature: 0.07       # initial value, learned

val:
  group_size: 64          # retrieval among 64 sections: chance = 1/64

optim:
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  warmup_steps: 1000
  total_steps: 50000
  min_lr_ratio: 0.05
  grad_clip: 1.0
  precision: auto

log_every: 100
val_every: 2500
ckpt_every: 5000
