general:
    num_epochs: 251
    validation_interval: 2
    experiment_name: "residualcondeae6"
    save_dir: "conde_ae"
    model: "residualcondeae"
dataset:
    h5_path: '/pgeoprj/godeep/ej49/ConDe/dataset/largesetv5.h5'
dataloader:
    batch_size: 256 
    num_workers: 4
    prefetch_factor: 5
    pin_memory: true
    persistent_workers: true
backbone:
    name: "EncoderDecoder"
    args:
        in_channels: 1
        out_channels: 1
        embed_dim: 2048
        channels_list: [64, 128, 256, 512, 512]
        res_blocks: [3, 3, 23, 3]
    functions:
        activation: 'silu'
        norm: 'batchnorm2d'
        encoder_final_activation: 'identity'
        decoder_final_activation: 'identity'


loss:
    losses:
        mae:
            name: "mae"
            pred: "recon"
            target: "x"
            alpha: 1
        grad:
            name: "GradientLoss"
            pred: "recon"
            target: "x"
            alpha: 0.1
        adv_loss:
            name: "bce"
            pred: "logits_bce"
            target: "labels"
            alpha: 1
        entropy_loss:
            name: "EntropyLoss"
            pred: "logits_conf"
            alpha: -100
        res_loss:
            name: "TripletLoss"
            pred: "rA"
            distance: "cosine"
            margin: 0.3
            target: "rP"
            triple: "rN"
            alpha: 5
        ortho:
            name: "ExclusivityLoss"
            pred: "rA"
            target: "sA"
            alpha: 1


model:
    lr: 0.0001
    weight_decay: 0
    mixed_precision: false


    
    
