general:
    num_epochs: 501
    validation_interval: 5
    experiment_name: "convnext_autoencoder"
    save_dir: "ae_res"
    model: "autoencoder"
dataset:
    h5_path: '/pgeoprj/godeep/ej49/ConDe/dataset/largesetv2.h5'
    do_augment: false
dataloader:
    batch_size: 256
    num_workers: 4
    prefetch_factor: 5
    pin_memory: true
    persistent_workers: true
backbone:
    name: "ConvNextAutoencoder"
    args:
        in_channels: 1
        embed_dim: 1024
        channels_list: [128, 256, 512, 512]
        res_blocks: [3, 3, 19, 3]
        drop_path_rate: 0.2


loss:
    losses:
        mae:
            name: "mae"
            pred: "recon"
            target: "x"
            alpha: 1
        fourier:
            name: "FourierLoss"
            pred: "recon"
            target: "x"
            alpha: 0.1
        grad:
            name: "GradientLoss"
            pred: "recon"
            target: "x"
            alpha: 0.1
model:
    lr: 0.0001
    weight_decay: 0.001


    
    
