general:
    num_epochs: 501
    validation_interval: 5
    experiment_name: "base_autoencoder23"
    save_dir: "ae_res"
    model: "autoencoder"
dataset:
    h5_path: '/pgeoprj/godeep/ej49/ConDe/dataset/largesetv2.h5'
    do_augment: false
dataloader:
    batch_size: 512
    num_workers: 4
    prefetch_factor: 5
    pin_memory: true
    persistent_workers: true
backbone:
    name: "EncoderDecoder"
    args:
        in_channels: 1
        out_channels: 1
        embed_dim: 2048
        channels_list: [64, 128, 256, 512, 512]
        res_blocks: [2, 2, 3, 2]
    functions:
        activation: 'silu'
        norm: 'instance2d'
        encoder_final_activation: 'identity'
        decoder_final_activation: 'identity'


loss:
    losses:
        mae:
            name: "mse"
            pred: "recon"
            target: "x"
            alpha: 1
        fourier:
            name: "FourierLoss"
            pred: "recon"
            target: "x"
            alpha: 0.1
        
model:
    lr: 0.0001
    weight_decay: 0.001


    
    
